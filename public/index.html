<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кулис - Дурак формат</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="durak-table">
  <!-- Жоғарғы ойыншылар -->
  <div class="opponents" id="players"></div>
  
  <!-- Орталық үстел -->
  <div class="center">
    <div class="trump-box">
      Козырь<br>
      <span id="trump">-</span>
    </div>
    <div class="pot-box">Банк: <span id="pot">0</span></div>
    <div id="table">
      <div id="battle" class="battle-area"></div>
      <div class="table-label" id="turn">Кезек: -</div>
    </div>
  </div>

  <!-- Астындағы өз қолың -->
  <div class="my-hand-area">
    <h3>Сенің карталарың</h3>
    <div id="hand" class="hand durak-hand"></div>
    <div class="actions">
      <div id="betActions" class="btn-group">
        <button data-act="blind">Соқыр</button>
        <button data-act="look" class="gold">Кулис ашу</button>
        <button data-act="call">Теңестіру</button>
        <button data-act="raise">Көтеру <input id="betAmount" type="number" value="100" step="100" style="width:60px"></button>
        <button data-act="fold" class="red">Пас</button>
      </div>
      <div id="duelActions" class="btn-group hidden">
        <button id="reveal" class="gold">Картаны көру</button>
        <button id="play" class="green">Шығу</button>
        <button id="foldDuel" class="red">Пас</button>
      </div>
    </div>
  </div>
</div>

<!-- Лобби -->
<div id="lobby" class="lobby-overlay">
  <div class="lobby-box">
    <h2>Кулис Online 🃏</h2>
    <input id="name" placeholder="Атың">
    <button id="create" class="big">Ойын құру</button>
    <div style="margin:15px 0">немесе</div>
    <input id="roomId" placeholder="Бөлме коды">
    <button id="join" class="big">Қосылу</button>
    <div id="roomInfo" style="margin-top:15px;font-size:18px"></div>
    <button id="copy" class="hidden">Кодты көшіру</button>
  </div>
</div>

<div id="log"></div>
<div id="game" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
